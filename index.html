<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beibit Akysh · Head of Growth & Profitability</title>
<meta name="description" content="Marketing, pricing and sales in one P&L. 8+ years growing B2B and B2C businesses. METRO Kazakhstan: +87% brand awareness, +39% new B2B registrations, MVP 2025.">
<meta name="robots" content="noindex">
<meta property="og:type" content="profile">
<meta property="og:title" content="Beibit Akysh · Head of Growth & Profitability">
<meta property="og:description" content="Marketing, pricing and sales in one P&L. +87% brand awareness, +39% new B2B registrations, METRO MVP 2025.">
<meta property="og:image" content="https://akyshb.github.io/akyshcv/media/portrait.jpg">
<link rel="icon" href="media/portrait-sm.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: Apple product-page rhythm. The first screen answers "who, what level, proof";
   every later chapter is evidence, and the page ends on one clear next step. */
:root{
  --bg:#FFFFFF; --bg2:#F5F5F7; --tile:#FFFFFF; --ink:#1D1D1F; --ink2:#6E6E73; --line:#D2D2D7;
  --blue:#0071E3; --link:#0066CC; --gold:#B8862B; --green:#1DB954;
  --dark:#000000; --dark-ink:#F5F5F7; --dark-ink2:#A1A1A6; --dark-sub:#1C1C1E; --dark-chip:#2C2C2E;
  --mn:#0A2C6B; --my:#FFE100; --seg-on:#FFFFFF;
  --sans:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
  --max:1024px; --r:28px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --bg2:#0B0B0C; --tile:#1C1C1E; --ink:#F5F5F7; --ink2:#A1A1A6; --line:#38383A;
  --blue:#2997FF; --link:#2997FF; --gold:#E3B35C; --green:#30D158; --dark:#1C1C1E; --dark-sub:#2C2C2E; --dark-chip:#3A3A3C; --seg-on:#48484A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#000000; --bg2:#0B0B0C; --tile:#1C1C1E; --ink:#F5F5F7; --ink2:#A1A1A6; --line:#38383A;
  --blue:#2997FF; --link:#2997FF; --gold:#E3B35C; --green:#30D158; --dark:#1C1C1E; --dark-sub:#2C2C2E; --dark-chip:#3A3A3C; --seg-on:#48484A; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth; scroll-padding-top:60px}
body{margin:0; background:var(--bg); color:var(--ink); font:17px/1.47 var(--sans); letter-spacing:-.022em; -webkit-font-smoothing:antialiased; overflow-x:hidden}
a{color:var(--link); text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--blue); outline-offset:3px; border-radius:8px}
h1,h2,h3,h4,p,figure,blockquote,ul{margin:0}
ul{padding:0; list-style:none}
h1,h2,h3{text-wrap:balance; letter-spacing:-.035em}
.wrap{max-width:var(--max); margin:0 auto; padding-left:max(20px, env(safe-area-inset-left,0px)); padding-right:max(20px, env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:17px; font-weight:600; color:var(--gold); letter-spacing:-.01em}
.h2{font-size:clamp(34px,6vw,64px); font-weight:700; line-height:1.05}
.sub{font-size:clamp(19px,2.2vw,24px); line-height:1.35; color:var(--ink2); font-weight:500; max-width:38em}
.center{text-align:center}
.center .sub{margin-inline:auto}
section{padding-block:100px 0}
.chap-head{display:grid; gap:14px; margin-bottom:48px}

/* nav */
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg)}
.nav{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:color-mix(in srgb,var(--bg) 78%,transparent); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.nav .wrap{display:flex; align-items:center; gap:18px; height:52px}
.brand{font-weight:600; font-size:17px; color:var(--ink); white-space:nowrap}
.brand:hover{text-decoration:none}
.links{display:flex; gap:20px; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0; justify-content:center}
.links::-webkit-scrollbar{display:none}
.links a{font-size:12px; color:var(--ink); opacity:.8; white-space:nowrap}
.links a:hover{opacity:1; text-decoration:none}
.links a.on{opacity:1; font-weight:600}
.pill-btn{all:unset; cursor:pointer; font-size:12px; font-weight:500; padding:5px 11px; border-radius:980px; background:var(--blue); color:#fff; white-space:nowrap}
.pill-btn:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
.lang-sw{all:unset; cursor:pointer; font-size:12px; color:var(--ink2); white-space:nowrap}
.lang-sw:hover{color:var(--ink)}
.lang-sw:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
.nav-r{display:flex; align-items:center; gap:14px; position:relative}
.menu-btn{all:unset; cursor:pointer; display:none; position:relative; width:32px; height:32px; border-radius:8px}
.menu-btn span{position:absolute; left:8px; right:8px; height:1.5px; border-radius:2px; background:var(--ink); transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.menu-btn span:first-child{top:12px}
.menu-btn span:last-child{top:19px}
.menu-btn[aria-expanded="true"] span:first-child{transform:translateY(3.5px) rotate(45deg)}
.menu-btn[aria-expanded="true"] span:last-child{transform:translateY(-3.5px) rotate(-45deg)}
.menu-btn:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
.menu-btn.hint::after{content:""; position:absolute; inset:0; border-radius:8px; animation:ring 1.6s ease-out 4}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--blue) 45%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.menu-tip{position:absolute; top:calc(100% + 16px); right:-4px; z-index:25; background:var(--ink); color:var(--bg); font-size:14px; font-weight:500; line-height:1.3; padding:10px 14px; border-radius:12px; white-space:nowrap; box-shadow:0 10px 30px rgba(0,0,0,.2); cursor:pointer; animation:tipIn .45s cubic-bezier(.2,.8,.2,1) both, tipBob 2s ease-in-out .6s 3}
.menu-tip::before{content:""; position:absolute; top:-5px; right:15px; width:10px; height:10px; background:inherit; transform:rotate(45deg); border-radius:2px}
.menu-tip[hidden]{display:none}
.menu-tip.out{animation:tipOut .25s ease both}
@keyframes tipIn{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none}}
@keyframes tipBob{50%{transform:translateY(3px)}}
@keyframes tipOut{to{opacity:0; transform:translateY(-4px)}}
@media (min-width:761px){ .menu-tip{display:none!important} }
.mnav{position:fixed; left:0; right:0; top:calc(52px + env(safe-area-inset-top,0px)); z-index:19; background:color-mix(in srgb,var(--bg) 92%,transparent); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid var(--line); padding:6px max(20px,env(safe-area-inset-right,0px)) 18px max(20px,env(safe-area-inset-left,0px)); animation:drop .3s cubic-bezier(.2,.8,.2,1) both}
.mnav[hidden]{display:none}
.mnav a{display:block; padding:12px 0; font-size:21px; font-weight:600; letter-spacing:-.02em; color:var(--ink); border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.mnav a:last-child{border-bottom:0}
.mnav a:hover{text-decoration:none; color:var(--link)}
@keyframes drop{from{opacity:0; transform:translateY(-8px)}}
@media (max-width:760px){ .links{display:none} .nav .wrap{justify-content:space-between} .menu-btn{display:block} }

/* buttons */
.btns{display:flex; flex-wrap:wrap; gap:14px 22px; align-items:center}
.center .btns{justify-content:center}
.btn{all:unset; box-sizing:border-box; cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-size:17px; padding:12px 22px; border-radius:980px; background:var(--blue); color:#fff; transition:filter .2s, transform .2s}
.btn:hover{filter:brightness(1.08); text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--blue); outline-offset:3px}
.btn.ghost{background:transparent; color:var(--link); box-shadow:inset 0 0 0 1px var(--link)}
.tlink{all:unset; cursor:pointer; font-size:17px; color:var(--link)}
.tlink:hover{text-decoration:underline}
.tlink:focus-visible{outline:2px solid var(--blue); outline-offset:3px; border-radius:6px}
.tlink::after{content:" ›"; font-size:1.1em}

/* hero */
.hero{padding-block:52px 0}
.hero-grid{display:grid; gap:20px 56px; align-items:center; grid-template-columns:minmax(0,1fr) minmax(0,340px); grid-template-areas:"copy photo" "copy quote"}
.hero-copy{grid-area:copy}
.topbar{background:var(--mn); color:#fff}
.topbar .wrap{padding-top:9px; padding-bottom:9px; text-align:center}
.topbar p{margin:0; font-size:13px; line-height:1.45; font-weight:500; color:#fff}
.topbar i{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--green); margin-right:9px; vertical-align:1px; animation:pulse 2.4s infinite}
.topbar a{color:var(--my); font-weight:600; white-space:nowrap; margin-left:10px}
.topbar a:hover{text-decoration:underline}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 55%,transparent)}70%,100%{box-shadow:0 0 0 8px transparent}}
.hero .eyebrow{margin-bottom:8px}
.hero h1{font-size:clamp(48px,7.6vw,88px); font-weight:800; line-height:1; letter-spacing:-.05em}
.hero .role{margin-top:12px; font-size:clamp(22px,2.8vw,30px); font-weight:600; line-height:1.2; letter-spacing:-.03em}
.hero .sub{margin-top:14px; max-width:31em}
.kpis{display:grid; grid-template-columns:repeat(3,max-content); gap:14px 36px; margin-top:28px}
.kpi b{display:block; font-size:clamp(30px,3.6vw,42px); font-weight:700; letter-spacing:-.045em; line-height:1; color:var(--blue)}
.kpi b.gold{color:var(--gold)}
.kpi span{display:block; font-size:13px; line-height:1.3; color:var(--ink2); margin-top:6px; max-width:11em}
.hero .btns{margin-top:30px}
.hero-photo{grid-area:photo; align-self:end; position:relative; width:100%; aspect-ratio:1; border-radius:var(--r); overflow:hidden; background:#E6C59C}
.hero-photo img{width:100%; height:100%; object-fit:cover; object-position:50% 30%; display:block; transform:scale(1.08); transition:transform 1.6s cubic-bezier(.2,.8,.2,1)}
.hero-photo.in img{transform:scale(1)}
.hero-quote{grid-area:quote; align-self:start; position:relative; z-index:1; margin:-76px 0 0 -48px; padding:18px 20px; border-radius:20px; background:color-mix(in srgb,var(--tile) 84%,transparent); backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%); box-shadow:0 18px 50px rgba(0,0,0,.16)}
.hero-quote p{font-size:15px; line-height:1.4; font-weight:600; color:var(--ink)}
.who{display:grid; grid-template-columns:36px minmax(0,1fr); gap:10px; align-items:center; margin-top:12px}
.who img{width:36px; height:36px; border-radius:50%; display:block; object-fit:cover}
.who b{display:block; font-size:13px; font-weight:600}
.who small{display:block; font-size:12px; line-height:1.3; color:var(--ink2)}
.badges{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:48px}
.badge{font-size:13px; font-weight:500; padding:6px 12px; border-radius:980px; background:var(--bg2); color:var(--ink)}
.badge b{color:var(--gold); font-weight:700}
@media (max-width:860px){
  .hero{padding-top:28px}
  .hero-grid{grid-template-columns:1fr; grid-template-areas:"photo" "copy" "quote"; gap:22px; text-align:center}
  .hero-photo{width:min(210px,58vw); justify-self:center; align-self:auto; border-radius:24px}
  .hero .sub{margin-inline:auto}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; text-align:center}
  .kpi span{margin-inline:auto}
  .hero .btns{justify-content:center}
  .hero-quote{margin:4px auto 0; max-width:460px; text-align:left; background:var(--bg2); box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none}
  .badges{margin-top:30px}
}

/* short / detailed views */
html[data-view="short"] .full-only, html[data-view="full"] .short-only{display:none!important}
.mode-bar{margin-bottom:26px; display:flex; flex-wrap:wrap; align-items:center; gap:12px 22px}
.mode-seg{display:inline-flex; gap:2px; padding:3px; border-radius:980px; background:color-mix(in srgb,var(--ink) 7%,transparent)}
.mode-seg button{all:unset; cursor:pointer; font-size:13px; font-weight:600; padding:7px 14px; border-radius:980px; color:var(--ink2); white-space:nowrap; transition:background .2s, color .2s}
.mode-seg button small{font-size:12px; font-weight:400; margin-left:5px; opacity:.8}
.mode-seg button[aria-pressed="true"]{background:var(--seg-on); color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.14)}
.mode-seg button:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
.mnav .mode-seg{margin:12px 0 8px}
@media (max-width:860px){ .mode-bar{flex-direction:column; margin:22px 0 18px} }

/* audience: who the recruiter is hiring for; html[data-aud] drives copy, proof and the CV file */
html[data-aud="general"] .aud-only{display:none!important}
html[data-view="short"]:not([data-aud="general"]) #results{display:none!important}
html[data-view="short"]:not([data-aud="general"]) #recs{margin-top:0; padding-top:0}
.aud-bar{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px}
.aud-bar .tl{font-size:13px; font-weight:600; color:var(--ink2)}
.aud-chips{display:flex; flex-wrap:wrap; gap:6px}
.aud-chips button{all:unset; box-sizing:border-box; cursor:pointer; font-size:13px; font-weight:600; padding:6px 13px; border-radius:980px; color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); white-space:nowrap; text-align:center; transition:background .2s, color .2s, box-shadow .2s}
.aud-chips button:hover{box-shadow:inset 0 0 0 1px var(--ink2)}
.aud-chips button[aria-pressed="true"]{background:var(--ink); color:var(--bg); box-shadow:none}
.aud-chips button:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
.mnav .aud-bar{margin:4px 0 12px}
@media (max-width:860px){ .aud-bar{flex-direction:column} .aud-chips{justify-content:center} }
@media (max-width:540px){ .aud-chips{display:grid; grid-template-columns:1fr 1fr; width:min(100%,360px)} .mnav .aud-bar{align-items:stretch} .mnav .aud-chips{width:100%; max-width:none} }
.tile.ph-tile{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:28px; align-items:center; padding:18px}
.ph-tile .txt{display:flex; flex-direction:column; gap:10px; padding:10px 14px 10px 0; min-width:0}
.tile-ph{all:unset; box-sizing:border-box; cursor:zoom-in; display:block; border-radius:18px; overflow:hidden; aspect-ratio:16/10; background:var(--line)}
.tile-ph img{width:100%; height:100%; object-fit:cover; object-position:50% 30%; display:block; transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.tile-ph:hover img{transform:scale(1.03)}
.tile-ph:focus-visible,.mini-ph:focus-visible{outline:2px solid var(--blue); outline-offset:3px}
@media (max-width:760px){ .tile.ph-tile{grid-template-columns:1fr; gap:16px; padding:14px} .ph-tile .txt{padding:0 8px 10px} }
.mini-ph{all:unset; box-sizing:border-box; cursor:zoom-in; display:grid; grid-template-columns:104px minmax(0,1fr); gap:12px; align-items:center; padding:8px; border-radius:16px; background:var(--bg2); margin-top:4px}
.mini-ph:hover{box-shadow:inset 0 0 0 1px var(--blue)}
.mini-ph img{width:104px; aspect-ratio:16/10; object-fit:cover; object-position:50% 30%; border-radius:10px; display:block}
.mini-ph span{font-size:13px; line-height:1.35; color:var(--ink2)}
.tile > a.tlink{margin-top:auto; padding-top:6px}
.tile.dark .tlink{color:#2997FF; margin-top:auto; padding-top:6px}
#glance{background:var(--bg2); margin-top:100px; padding-block:100px}
.glance{max-width:860px; margin:0 auto; background:var(--tile); border-radius:var(--r); padding:6px 32px}
.gl-row{display:grid; grid-template-columns:150px minmax(0,1fr); gap:4px 24px; padding:17px 0; border-bottom:1px solid var(--line)}
.gl-row:last-child{border-bottom:0}
.gl-row dt{font-size:14px; font-weight:600; color:var(--ink2); padding-top:2px}
.gl-row dd{margin:0; font-size:17px; line-height:1.45; color:var(--ink)}
.gl-row dd strong{font-weight:700}
@media (max-width:540px){ .glance{padding:4px 22px} .gl-row{grid-template-columns:1fr; padding:14px 0} .gl-row dd{font-size:16px} }
html[data-view="short"] #res-grid, html:not([data-aud="general"]) #res-grid{grid-auto-flow:dense}
.more-card{background:var(--mn); color:#fff; border-radius:var(--r); padding:52px 32px; text-align:center}
.more-card .eyebrow{color:var(--my)}
.more-card h3{font-size:clamp(28px,4vw,40px); font-weight:700; line-height:1.1; margin-top:10px}
.more-card ul{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:24px auto 0; max-width:640px}
.more-card li{font-size:14px; padding:7px 13px; border-radius:980px; background:rgba(255,255,255,.12); color:#fff}
.more-card .btn{margin-top:28px; background:var(--my); color:var(--mn); font-weight:600}
@media (max-width:540px){ .more-card{padding:40px 22px} }

/* bento */
.grey{background:var(--bg2); margin-top:100px; padding-block:100px}
.grey + .grey{margin-top:0; padding-top:0}
.bento{display:grid; gap:20px; grid-template-columns:repeat(6,minmax(0,1fr))}
.tile{background:var(--tile); border-radius:var(--r); padding:32px; display:flex; flex-direction:column; gap:10px; min-width:0; grid-column:span 2; overflow:hidden; position:relative}
.tile.w3{grid-column:span 3}
.tile.w4{grid-column:span 4}
.tile.w6{grid-column:span 6}
@media (max-width:860px){ .bento{grid-template-columns:repeat(2,minmax(0,1fr))} .tile,.tile.w3{grid-column:span 1} .tile.w4,.tile.w6{grid-column:span 2} }
@media (max-width:540px){ .bento{grid-template-columns:1fr; gap:14px} .tile,.tile.w3,.tile.w4,.tile.w6{grid-column:span 1} .tile{padding:26px}
  .bento.compact{grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px} .bento.compact .tile{padding:20px} .bento.compact .tile.w6,.bento.compact .tile.w4,.bento.compact .tile.w3{grid-column:span 2} .bento.compact .big{font-size:min(34px,7.2vw)} }  /* "30 000+" stays on one line down to 320 px */
section .tile{background:var(--bg2)}
.tile .k{font-size:14px; font-weight:600; color:var(--ink2)}
.tile .big{font-size:clamp(40px,5.6vw,60px); font-weight:700; line-height:1; letter-spacing:-.05em}
.tile .big.blue{color:var(--blue)}
.tile .big.gold{color:var(--gold)}
.tile h3{font-size:24px; font-weight:700; line-height:1.15}
.tile p{color:var(--ink2); font-size:16px; line-height:1.45}
.tile p strong{color:var(--ink); font-weight:600}
.tile.dark{background:var(--dark); color:var(--dark-ink)}
.tile.dark .k, .tile.dark p{color:var(--dark-ink2)}
.tile.dark p strong{color:var(--dark-ink)}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px}
.chips span{font-size:13px; padding:5px 10px; border-radius:980px; border:1px solid var(--dark-chip); color:var(--dark-ink)}
.chips.lt span{border-color:var(--line); color:var(--ink)}
.tile .proof{margin-top:auto; padding-top:14px; border-top:1px solid var(--line); font-size:15px; line-height:1.4; font-weight:500; color:var(--ink)}
.minis{margin-top:auto; padding-top:18px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; border-top:1px solid var(--dark-chip)}
.minis b{display:block; font-size:clamp(30px,3.4vw,40px); font-weight:700; letter-spacing:-.045em; line-height:1; color:var(--gold)}
.minis span{display:block; margin-top:6px; font-size:13px; line-height:1.3; color:var(--dark-ink2)}
.proof small{display:block; margin-top:4px; font-size:12px; font-weight:400; color:var(--ink2)}

/* team map */
.org{display:grid; gap:12px; grid-template-columns:repeat(2,minmax(0,1fr)); margin-top:8px}
@media (max-width:540px){ .org{grid-template-columns:1fr} }
.org div{border-radius:18px; padding:16px; background:var(--dark-sub)}
.org b{display:block; font-size:13px; margin-bottom:8px; color:var(--dark-ink)}
.org span{display:inline-block; font-size:12px; margin:0 4px 4px 0; padding:4px 9px; border-radius:980px; background:var(--dark-chip); color:var(--dark-ink)}

/* recommendations */
.quotes{display:grid; gap:20px; grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:760px){ .quotes{grid-template-columns:1fr; gap:14px} }
.qcard{background:var(--tile); border-radius:var(--r); padding:28px; display:flex; flex-direction:column; gap:14px; min-width:0}
@media (max-width:540px){ .qcard{padding:22px} }
.qhead{display:grid; grid-template-columns:56px minmax(0,1fr); gap:14px; align-items:center}
.qhead img{width:56px; height:56px; border-radius:50%; object-fit:cover; display:block; background:var(--bg2)}
.qhead b{display:block; font-size:17px; font-weight:600; letter-spacing:-.02em}
.qhead small{display:block; font-size:13px; color:var(--ink2); line-height:1.35}
.rel{align-self:flex-start; font-size:12px; font-weight:600; padding:4px 10px; border-radius:980px; background:color-mix(in srgb,var(--blue) 12%,transparent); color:var(--link)}
.rel.top{background:color-mix(in srgb,var(--gold) 18%,transparent); color:var(--gold)}
.qpull{font-size:19px; line-height:1.35; font-weight:600; letter-spacing:-.02em; color:var(--ink)}
.qbody{font-size:15px; line-height:1.5; color:var(--ink2); display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden}
.qcard.open .qbody{display:block; -webkit-line-clamp:unset}
.qfoot{margin-top:auto; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:6px 14px; font-size:13px; color:var(--ink2)}
.qfoot .more{all:unset; cursor:pointer; font-size:14px; color:var(--link)}
.qfoot .more:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:4px}
.refs-t{margin:44px 0 14px; text-align:center; font-size:15px; font-weight:600; color:var(--ink2)}
.refs{display:flex; flex-wrap:wrap; justify-content:center; gap:8px}
.refs span{font-size:13px; padding:7px 12px; border-radius:980px; background:var(--tile); color:var(--ink)}
.refs span small{font-size:12px; color:var(--ink2)}

/* METRO in numbers: the six figures beside the year's reel, the department below */
.scale-row{display:grid; gap:20px; grid-template-columns:minmax(0,1fr) minmax(0,.42fr); margin-bottom:20px}
.scale-row .bento{grid-template-columns:repeat(2,minmax(0,1fr))}
.scale-row .tile{grid-column:span 1}
.scale-clip .zoom{width:100%; height:100%; min-height:320px; border-radius:var(--r)}  /* a block button still shrinks to fit, so stretch it */
@media (max-width:600px){ .scale-row{grid-template-columns:1fr} .scale-clip .zoom{height:auto; min-height:0; aspect-ratio:4/5; max-width:420px; margin:0 auto} }
@media (max-width:540px){ .scale-row{gap:12px; margin-bottom:12px} }

/* story */
.story{display:grid; gap:20px; grid-template-columns:1fr}
@media (min-width:860px){ .story{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
/* UltraFresh: the two text tiles on the left, the campaign film and the shoot as vertical clips on the right */
.uf-tiles{display:grid; gap:20px; align-content:start; min-width:0}
.uf-tiles .tile{grid-column:auto}
@media (min-width:860px){ .uf-story{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); align-items:start} }
/* clip rows: vertical tiles, side by side on desktop, swiped on a phone */
.reels{display:grid; gap:16px; grid-template-columns:repeat(3,minmax(0,1fr))}
.uf-reels{grid-template-columns:repeat(2,minmax(0,1fr))}
.uf-reels .zoom{aspect-ratio:9/16}
.reel{margin:0; display:grid; gap:14px; align-content:start; min-width:0}
.reel .zoom{aspect-ratio:4/5; border-radius:22px}
.reel h4{font-size:18px; font-weight:700; letter-spacing:-.02em; line-height:1.25}
.reel p{font-size:15px; line-height:1.45; color:var(--ink2); margin-top:4px}
@media (max-width:760px){
  .reels{grid-template-columns:none; grid-auto-flow:column; grid-auto-columns:74%; overflow-x:auto; overscroll-behavior-x:contain; scroll-snap-type:x mandatory; scrollbar-width:none}
  .reels::-webkit-scrollbar{display:none}
  .reels > *{scroll-snap-align:start}
  .uf-reels{grid-auto-columns:56%}
}
.timeline-mini{display:grid; grid-template-columns:auto 1fr; gap:8px 16px; font-size:15px}
.timeline-mini .y{font-weight:700; color:var(--gold)}
.timeline-mini .t{color:var(--ink)}
.video-card{display:grid; grid-template-columns:104px minmax(0,1fr); gap:14px; align-items:center; padding:10px; border-radius:18px; background:var(--bg); color:var(--ink)}
.video-card:hover{text-decoration:none; box-shadow:inset 0 0 0 1px var(--blue)}
.poster{position:relative; aspect-ratio:16/9; max-width:100%; border-radius:10px; background:linear-gradient(135deg,#1D1D1F,#48484A); display:grid; place-items:center}
.poster::after{content:""; width:0; height:0; border-left:13px solid #fff; border-top:8px solid transparent; border-bottom:8px solid transparent; margin-left:4px}
.poster.web{background:linear-gradient(135deg,var(--gold),#7A5A1C)}
.poster.web::after{border:0; width:16px; height:16px; border-radius:50%; box-shadow:inset 0 0 0 2px #fff; margin:0}
.video-card .vt{display:block; font-weight:600; font-size:15px; line-height:1.3}
.video-card .vs2{display:block; font-size:13px; color:var(--ink2); margin-top:2px}

/* before / after */
.ba{display:grid; gap:20px; margin-bottom:20px}
.ba-item{margin:0; background:var(--bg2); border-radius:var(--r); padding:24px; display:grid; gap:14px; min-width:0}
.ba-item figcaption{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:baseline; font-size:15px; line-height:1.4; color:var(--ink2)}
.ba-item .tag{font-size:13px; font-weight:600; padding:4px 11px; border-radius:980px; background:var(--line); color:var(--ink); white-space:nowrap}
.ba-item.win{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--blue) 40%,transparent)}
.ba-item.win .tag{background:var(--blue); color:#fff}
.ba-scroll{overflow-x:auto; border-radius:12px; scrollbar-width:thin}
.ba-scroll img{display:block; width:100%; min-width:820px; max-width:none; height:auto}
.swipe{display:none; text-align:center; font-size:13px; color:var(--ink2)}
@media (max-width:860px){ .swipe{display:block} .ba-item{padding:18px} }

/* Young Talents: METRO navy + yellow, as on metro-shop.kz/youngtalents and the program deck */
.yt{position:relative; overflow:hidden; isolation:isolate; border-radius:var(--r); background:var(--mn); color:#fff; padding:clamp(26px,5vw,56px); display:grid; gap:clamp(26px,3.6vw,40px)}
.yt::after{content:""; position:absolute; z-index:-1; right:-90px; top:-90px; width:260px; height:260px; border-radius:50%; border:44px solid var(--my); opacity:.95}
.yt-kick{font-size:13px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--my)}
.yt-title{margin-top:8px; font-family:"Inter",var(--sans); font-size:clamp(46px,8.4vw,96px); font-weight:900; line-height:.9; letter-spacing:-.035em; text-transform:uppercase}
.yt-lead{margin-top:16px; font-size:clamp(17px,1.9vw,20px); line-height:1.45; color:rgba(255,255,255,.82); max-width:36em}
.yt-stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
.yt-stats div{border-top:2px solid var(--my); padding-top:10px; min-width:0}
.yt-stats b{display:block; font-size:clamp(26px,3.4vw,38px); font-weight:800; line-height:1.05; letter-spacing:-.04em; color:var(--my)}
.yt-stats span{display:block; margin-top:4px; font-size:13px; line-height:1.3; color:rgba(255,255,255,.75)}
@media (max-width:640px){ .yt-stats{grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px 14px} .yt-stats div:first-child{grid-column:1/-1} .yt::after{width:150px; height:150px; border-width:26px; right:-78px; top:-78px} .yt-kick{max-width:calc(100% - 64px)} }
.yt-row{position:relative; display:grid; gap:14px; grid-template-columns:minmax(0,3fr) minmax(0,1.35fr)}
.yt-row::before{content:""; position:absolute; z-index:0; left:-120px; right:-120px; top:34%; height:70px; background:var(--my); transform:rotate(-5deg)}
.yt-cards,.yt-photos{position:relative; z-index:1}
.yt-cards{display:grid; gap:14px; grid-template-columns:repeat(3,minmax(0,1fr))}
.pcard{background:#fff; color:#33415C; border-radius:16px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 14px 34px rgba(0,0,0,.28); min-width:0}
.pcard .art{aspect-ratio:3/4; background:#5B2AA8}
.pcard .art img{width:100%; height:100%; object-fit:cover; display:block}
.pcard .art.ph{display:grid; place-items:center; background:radial-gradient(circle at 30% 25%,#FF4FB8 0 18%,transparent 19%),radial-gradient(circle at 75% 70%,#FFE100 0 14%,transparent 15%),linear-gradient(135deg,#3B1C8C,#0A2C6B 60%,#1F7AE0)}
.pcard .art.ph span{font-family:"Inter",var(--sans); font-size:56px; font-weight:900; color:#fff; letter-spacing:-.04em; text-shadow:4px 4px 0 #FF4FB8}
.pcard .meta{padding:12px 14px 14px; display:flex; flex-direction:column; gap:3px; font-size:12px; line-height:1.35; flex:1}
.pcard .ven{font-size:10px; letter-spacing:.04em; color:#8A93A6}
.pcard h4{font-size:14px; font-weight:800; letter-spacing:0; text-transform:uppercase; color:var(--mn); margin:2px 0 4px}
.pcard .cu{align-self:flex-start; margin-top:auto; padding-top:0; background:var(--my); color:var(--mn); font-weight:700; font-size:11px; padding:4px 9px; border-radius:7px}
.pcard .meta p + .cu{margin-top:8px}
.yt-photos{display:grid; gap:14px; grid-template-rows:3fr 2fr}  /* the vertical clip gets the taller cell */
.zoom{all:unset; box-sizing:border-box; cursor:zoom-in; position:relative; display:block; border-radius:16px; overflow:hidden; background:#16376F; min-height:0}
.zoom img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.zoom:hover img{transform:scale(1.04)}
.zoom video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 40%; display:block}
.yt-photos .zoom video{object-position:50% 12%}
/* clip badge: the tile is a muted preview, a tap opens the clip with sound */
.vplay{position:absolute; z-index:1; top:10px; right:10px; width:32px; height:32px; border-radius:50%; background:rgba(0,0,0,.5); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.vplay::after{content:""; position:absolute; left:12px; top:10px; border-style:solid; border-width:6px 0 6px 10px; border-color:transparent transparent transparent #fff}
.zoom:focus-visible{outline:3px solid var(--my); outline-offset:3px}
.zoom .cap{position:absolute; left:10px; right:10px; bottom:10px; font-size:11px; font-weight:600; line-height:1.3; color:#fff; background:rgba(0,0,0,.5); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); padding:6px 9px; border-radius:10px}
.yt-photos .zoom:last-child img{object-position:50% 22%}
@media (max-width:760px){
  .yt-row{grid-template-columns:1fr}
  .yt-row::before{top:20%}
  .yt-cards{grid-template-columns:none; grid-auto-flow:column; grid-auto-columns:62%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; padding:4px 2px 18px; margin:-4px -2px -18px}
  .yt-cards::-webkit-scrollbar{display:none}
  .pcard{scroll-snap-align:start}
  .yt-photos{grid-template-rows:none; grid-template-columns:repeat(2,minmax(0,1fr))}
  .yt-photos .zoom{aspect-ratio:4/5}
  .yt-photos .vplay{width:26px; height:26px; top:8px; right:8px}
  .yt-photos .vplay::after{left:10px; top:7px; border-width:6px 0 6px 9px}
}
.yt-cols{display:grid; gap:28px 40px; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
@media (max-width:760px){ .yt-cols{grid-template-columns:1fr} }
.yt-h{font-size:13px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--my); margin-bottom:14px}
.yt-chips{display:flex; flex-wrap:wrap; gap:8px}
.yt-chips li{font-size:14px; font-weight:600; padding:7px 12px; border-radius:980px; box-shadow:inset 0 0 0 1.5px rgba(255,225,0,.7); color:#fff}
.yt-small{margin-top:14px; font-size:14px; line-height:1.45; color:rgba(255,255,255,.7)}
.yt-list{display:grid; gap:12px}
.yt-list li{position:relative; padding-left:30px; font-size:15px; line-height:1.45; color:rgba(255,255,255,.8)}
.yt-list li strong{color:#fff; font-weight:700}
.yt-list li::before{content:""; position:absolute; left:0; top:3px; width:18px; height:18px; border-radius:50%; background:var(--my)}
.yt-list li::after{content:""; position:absolute; left:6px; top:7px; width:5px; height:8px; border:solid var(--mn); border-width:0 2px 2px 0; transform:rotate(45deg)}
.yt-foot{display:flex; flex-wrap:wrap; align-items:center; gap:14px 24px}
.yt-foot .yt-small{margin:0; flex:1; min-width:240px}
.yt-btn{display:inline-flex; align-items:center; gap:6px; font-size:16px; font-weight:800; letter-spacing:.02em; text-transform:uppercase; padding:13px 22px; border-radius:12px; background:var(--my); color:var(--mn); transition:transform .2s, filter .2s}
.yt-btn:hover{text-decoration:none; filter:brightness(1.05); transform:translateY(-1px)}
.yt-btn:focus-visible{outline:3px solid #fff; outline-offset:3px}

/* media carousel */
.car-head{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px 24px; margin-bottom:24px}
.car-head .eyebrow{margin-bottom:6px}
.car-head .h2{font-size:clamp(30px,4.4vw,48px)}
.car-nav{display:flex; gap:10px; margin-left:auto}
.car-nav button{all:unset; cursor:pointer; width:40px; height:40px; border-radius:50%; background:var(--bg2); color:var(--ink); display:grid; place-items:center; transition:opacity .2s, background .2s}
.car-nav button:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 10%,var(--bg2))}
.car-nav button:disabled{opacity:.3; cursor:default}
.car-nav button:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
.car-nav svg{width:16px; height:16px; display:block}
.track{--n:4; display:grid; grid-auto-flow:column; grid-auto-columns:calc((100% - (var(--n) - 1)*16px)/var(--n)); gap:16px; overflow-x:auto; overscroll-behavior-x:contain; scroll-snap-type:x mandatory; scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
@media (max-width:860px){ .track{grid-auto-columns:calc((100% - 16px)/2.25)} }
@media (max-width:540px){ .track{grid-auto-columns:70%; gap:12px} }
.slide{all:unset; box-sizing:border-box; cursor:zoom-in; position:relative; display:block; aspect-ratio:4/5; border-radius:22px; overflow:hidden; background:var(--bg2); scroll-snap-align:start; min-width:0}
.slide img,.slide video{width:100%; height:100%; object-fit:cover; object-position:50% 25%; display:block; transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.slide video{object-position:50% 40%}
.slide:hover img,.slide:hover video{transform:scale(1.04)}
.slide .cap{position:absolute; left:12px; bottom:12px; max-width:calc(100% - 24px); font-size:12px; font-weight:600; color:#fff; background:rgba(0,0,0,.45); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); padding:5px 10px; border-radius:980px}
.slide:focus-visible{outline:3px solid var(--blue); outline-offset:3px}
.car-t{font-size:19px; font-weight:600; letter-spacing:-.02em}
.h2.sm{font-size:clamp(30px,4.4vw,48px)}

/* awards */
.awards{display:grid; gap:20px; grid-template-columns:repeat(2,minmax(0,1fr))}
.awards.one{grid-template-columns:1fr}
@media (max-width:760px){ .awards{grid-template-columns:1fr; gap:14px} }
.award{position:relative; overflow:hidden; isolation:isolate; border-radius:var(--r); padding:36px; background:var(--tile); display:flex; flex-direction:column; gap:10px; min-height:300px; min-width:0}
@media (max-width:540px){ .award{padding:26px; min-height:0} }
.award::before{content:""; position:absolute; z-index:-1; right:-60px; top:-60px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb,var(--gold) 30%,transparent), transparent 70%)}
.award.dark{background:var(--dark); color:var(--dark-ink)}
.award .big{font-size:clamp(76px,10vw,120px); font-weight:800; line-height:.92; letter-spacing:-.06em; background:linear-gradient(135deg,#F6D47A,#C8962F 55%,#8A6420); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:4px}
.award .k{font-size:21px; font-weight:700; letter-spacing:-.02em; margin-top:4px}
.award p{font-size:16px; line-height:1.45; color:var(--ink2)}
.award.dark p{color:var(--dark-ink2)}
.award p.k{color:var(--ink)}
.award.dark p.k{color:var(--dark-ink)}
.alinks{margin-top:auto; padding-top:12px; display:flex; flex-wrap:wrap; gap:8px 22px}
.alinks a.tlink{font-size:15px}
.award.dark .alinks a.tlink{color:#2997FF}

/* podcast */
.pod{display:grid; grid-template-columns:200px minmax(0,1fr); gap:28px; align-items:center; padding:24px; border-radius:var(--r); background:var(--bg2); margin-bottom:56px}
.pod-cover{aspect-ratio:1; border-radius:18px; overflow:hidden; background:#2D5BFF; box-shadow:0 14px 34px rgba(0,0,0,.18)}
.pod-cover img{width:100%; height:100%; object-fit:cover; display:block}
.pod-k{font-size:13px; font-weight:600; color:var(--ink2)}
.pod-k b{color:var(--gold); font-weight:700}
.pod h3{margin-top:6px; font-size:clamp(22px,2.6vw,30px); font-weight:700; line-height:1.15}
.pod-q{margin-top:10px; font-size:16px; line-height:1.45; color:var(--ink2)}
.player{margin-top:18px; display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px 14px; align-items:center}
.pp{all:unset; cursor:pointer; width:52px; height:52px; border-radius:50%; background:var(--blue); color:#fff; display:grid; place-items:center; transition:transform .2s, filter .2s}
.pp:hover{filter:brightness(1.08)}
.pp:active{transform:scale(.95)}
.pp svg{width:20px; height:20px; display:block}
.pp .i-pause{display:none}
.pod.playing .pp .i-play{display:none}
.pod.playing .pp .i-pause{display:block}
.seek{-webkit-appearance:none; appearance:none; display:block; width:100%; height:6px; margin:0; border-radius:6px; cursor:pointer; background:linear-gradient(to right, var(--blue) var(--p,0%), color-mix(in srgb,var(--ink) 16%,transparent) var(--p,0%))}
.seek::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.4)}
.seek::-moz-range-thumb{width:16px; height:16px; border:0; border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.4)}
.ptime{display:flex; justify-content:space-between; margin-top:7px; font-size:12px; color:var(--ink2)}
.prow{grid-column:1/-1; display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.prow button{all:unset; cursor:pointer; font-size:13px; font-weight:600; padding:6px 12px; border-radius:980px; background:color-mix(in srgb,var(--ink) 8%,transparent); color:var(--ink)}
.prow button:hover{background:color-mix(in srgb,var(--ink) 14%,transparent)}
.prow a{margin-left:auto; font-size:14px}
.pp:focus-visible,.prow button:focus-visible,.seek:focus-visible{outline:2px solid var(--blue); outline-offset:3px}
.chaps{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:8px}
.chaps:empty{display:none}
.chaps button{all:unset; cursor:pointer; font-size:13px; padding:6px 11px; border-radius:10px; background:var(--tile); color:var(--ink)}
.chaps button b{color:var(--blue); font-weight:600; margin-right:6px}
.pod-alt{display:none; margin-top:18px}
.pod.noaudio .player{display:none}
.pod.noaudio .pod-alt{display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center}
@media (max-width:700px){
  .pod{grid-template-columns:96px minmax(0,1fr); gap:14px 16px; padding:18px; align-items:start}
  .pod-cover{border-radius:14px}
  .pod-main{display:contents}
  .pod-head{grid-column:2}
  .pod-q,.player,.pod-alt{grid-column:1/-1}
  .pod-q{margin-top:2px}
  .player{margin-top:0}
}

/* path */
.path{display:grid; border-top:1px solid var(--line)}
.job{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 20px; padding:18px 0; border-bottom:1px solid var(--line)}
.job h3{font-size:18px; font-weight:600; letter-spacing:-.02em}
.job .d{font-size:15px; color:var(--ink2); white-space:nowrap}
.job p{grid-column:1/-1; font-size:15px; color:var(--ink2)}
.job .jb{grid-column:1/-1; display:grid; gap:7px; margin:8px 0 2px; padding:0; list-style:none}
.job .jb li{position:relative; padding-left:18px; font-size:15px; line-height:1.45; color:var(--ink)}
.job .jb li::before{content:""; position:absolute; left:3px; top:.62em; width:5px; height:5px; border-radius:50%; background:var(--blue)}
@media (max-width:540px){ .job{grid-template-columns:1fr} }

/* contact */
.contact{padding-block:110px 90px; text-align:center}
.contact .h2{font-size:clamp(40px,7vw,80px)}
.contact .btns{justify-content:center; margin-top:28px}
.clist{display:grid; max-width:560px; margin:40px auto 0; text-align:left; border-top:1px solid var(--line)}

const SPAN = {w3:3, w4:4, w6:6};
const spanOf = x => SPAN[(x.cls||"").split(" ")[0]] || 2;
function setSpan(x, s){ x.cls = [s>2 ? "w"+s : "", ...(x.cls||"").split(" ").filter(c=>c && !SPAN[c])].filter(Boolean).join(" "); }
function pack(list){
  const out = list.map(x=>({...x})); let row = [], used = 0;
  const close = () => {
    if(!row.length || used===6) return;
    const n = row.length;
    if(6%n===0 && row.every(x=>spanOf(x)<=6/n)) row.forEach(x=>setSpan(x, 6/n));
    else setSpan(row[n-1], spanOf(row[n-1]) + 6 - used);
  };
  for(const x of out){ const s=spanOf(x); if(used+s>6){ close(); row=[]; used=0; } row.push(x); used+=s; }
  close();
  return out;
}

  $("#more .btn").dataset.go = aud.proof ? "#proof" : "#why";
  $("#rc-sub").textContent = tr(T.rc_sub); $("#rc-sub").hidden = !tr(T.rc_sub);
  $("#c-sub").textContent = tr(full ? TX("c_sub") : T.c_sub_s);
  const hq = aud.hq;
  $("#hero-quote").innerHTML = `<p>${tr(hq.q)}</p><figcaption class="who"><img src="${hq.img}" alt=""><span><b>${hq.n}</b><small>${tr(hq.r)}</small></span></figcaption>`;

  /* One fact, one place. Blocks claim their facts in this order: the first screen, then whichever block tells a fact
     most fully (proof, department, why, stories, awards, media, results), then the short summaries (badges, profile, experience).
     A later item whose fact is already claimed is left out; hidden blocks claim nothing. */
  const claimed = new Set();
  const fk = x => [].concat(x && x.f || []);
  const free = x => !fk(x).some(k=>claimed.has(k));
  const claim = x => { fk(x).forEach(k=>claimed.add(k)); return x; };
  const keep = list => list.filter(x=>free(x) && !!claim(x));

  claim({f:aud.sf});
  aud.kpis.forEach(claim);
  $("#kpis").innerHTML = aud.kpis.map(k=>`<div class="kpi"><b class="num ${k.c||""}">${tr(k.b)}</b><span>${tr(k.k)}</span></div>`).join("");
  $("#kpis").hidden = !aud.kpis.length;

  if(aud.proof){
    $("#proof-eyebrow").textContent = tr(aud.proof.eyebrow); $("#proof-title").textContent = tr(aud.proof.title);
    $("#proof-sub").textContent = tr(aud.proof.sub); $("#proof-sub").hidden = !tr(aud.proof.sub);
    /* the short view keeps the four tiles marked s, widening the small ones so they fill two rows */
    const tiles = keep(aud.proof.tiles.filter(x=>full || x.s)).map(x=>!full && x.sc ? {...x, cls:x.sc} : x);
    $("#proof-grid").innerHTML = pack(tiles).map(tile).join("");
  } else $("#proof-grid").innerHTML = "";

  if(full){
    $("#scale-grid").innerHTML = pack(keep(SCALE)).map(s=>tile({k:s.k, big:s.big, c:s.c, cls:s.cls})).join("");
    $("#scale-clip").innerHTML = `<button type="button" class="zoom" ${zoomData(METRO_CLIP)}>${tileMedia(METRO_CLIP, tr(METRO_CLIP.c))}<span class="cap">${tr(METRO_CLIP.c)}</span></button>`;
    $("#scale-dept").innerHTML =
      `<div class="tile w6 dark rv"><p class="k">${ru()?"Мой департамент":"My department"}</p><h3>${ru()?"12 функций в двух блоках: рост и прибыльность.":"12 functions in two blocks: growth and profitability."}</h3>
       <div class="org">${ORG.map(g=>`<div><b>${tr(g.t)}</b>${g.items.map(i=>`<span>${i}</span>`).join("")}</div>`).join("")}</div></div>`;
    claim({f:ORG_F});
    $("#why-grid").innerHTML = pack(WHY.map(w=>{
      const x = {...claim(w), minis:w.minis && keep(w.minis)};
      if(w.minis && !x.minis.length) setSpan(x, 3);  /* with no minis left the range tile gives the row's space to its neighbour */
      if(w.ph && free(w.ph)) claim(w.ph); else delete x.ph;
      return x;
    })).map(tile).join("");
    $("#pp-reels").innerHTML = keep(PP).map(p=>`<figure class="reel"><button type="button" class="zoom" ${zoomData(p)}>${tileMedia(p, tr(p.c))}</button>
      <figcaption><h4>${tr(p.c)}</h4><p>${tr(p.p)}</p></figcaption></figure>`).join("");
    const tools = keep(TOOLS);
    $("#tools-grid").innerHTML = pack(tools.map(t=>({k:t.k, big:t.big, c:"blue", p:t.p}))).map(tile).join("");
    $("#tools-head").hidden = $("#tools-grid").hidden = !tools.length;
    const aw = keep(AWARDS);
    $("#awards-grid").classList.toggle("one", aw.length===1);
    $("#awards-grid").innerHTML = aw.map(a=>`<div class="award rv ${a.cls||""}"><div class="big">${a.big}</div><p class="k">${tr(a.k)}</p><p>${tr(a.p)}</p>${a.link?`<div class="alinks"><a class="tlink" href="${a.link.href}" target="_blank" rel="noopener">${tr(a.link.t)}</a></div>`:""}</div>`).join("");
    const slides = keep(SLIDES);
    $("#track").style.setProperty("--n", Math.min(4, Math.max(3, slides.length)));  /* on desktop a short set fills the row instead of leaving a gap */
    $("#track").innerHTML = slides.map(s=>`<button type="button" class="slide" ${zoomData(s)}>${tileMedia(s, tr(s.c))}<span class="cap">${tr(s.c)}</span></button>`).join("");
  }

  /* results: both views for the general profile, the detailed view for a role (its short view shows #proof instead) */
  if(full || !aud.proof){
    const all = RES.filter(r=>full || r.s), res = keep(all);
    $("#res-grid").innerHTML = pack(res).map(tile).join("");
    if(aud.proof && res.length < all.length) $('#results [data-k="r_title"]').textContent = tr(T.r_more);
  }

  const badges = keep(BADGES);
  $("#badges").innerHTML = badges.map(b=>`<span class="badge">${b.b?`<b>${b.b}</b> `:""}${tr(b.t)}</span>`).join("");
  $("#badges").hidden = !badges.length;

  if(!full) $("#glance-list").innerHTML = GLANCE.map(g=>{
    let dd = "";
    if(g.parts){ const ps = keep(g.parts); if(ps.length) dd = ps.map(tr).join(g.sep || " ") + (g.end || ""); }
    else { const v = g.id ? aud[g.id] : g.v; if(v && free(v)){ claim(v); dd = tr(v); } }
    return dd ? `<div class="gl-row"><dt>${tr(g.l)}</dt><dd>${dd}</dd></div>` : "";
  }).join("");

  /* experience: the short view gives each role one line; the detailed one its scope and bullets, the focus's tag first */
  const tag = A==="general" ? "g" : A[0];
  const first = list => { const x = (list || []).find(free); return x ? claim(x) : null; };
  $("#jobs").innerHTML = JOBS.map(j=>{
    let lead, b = [];
    if(full){
      lead = first(j.s);
      b = keep((j.b || []).slice().sort((x,y)=>y.t.includes(tag) - x.t.includes(tag))).slice(0,4);
      if(!lead && !b.length) lead = first(j.p);
      if(!lead && b.length===1) lead = b.pop();
    } else lead = first([...(j.p || []), ...(j.s || [])]);
    return `<div class="job"><h3>${tr(j.t)}</h3><span class="d num">${tr(j.d)}</span>${lead?`<p>${tr(lead)}</p>`:""}${b.length?`<ul class="jb">${b.map(x=>`<li>${tr(x)}</li>`).join("")}</ul>`:""}</div>`;
  }).join("");
  if(full && aud.proof) $('#path [data-k="p_eyebrow"]').textContent = `${tr(T.p_eyebrow)} · ${tr(aud.chip)}`;

  /* the focus picks the two quotes for the short view and leads with them in the detailed one */
  const byId = id => QUOTES.find(q=>q.id===id);
  const qs = aud.recs.map(byId).concat(full ? QUOTES.filter(q=>!aud.recs.includes(q.id)) : []);
  $("#quotes").innerHTML = qs.map((q,i)=>`<figure class="qcard rv" id="q-${i}">
      <div class="qhead"><img src="${q.img}" alt="${q.n}" width="56" height="56"><div><b>${q.n}</b><small>${tr(q.r)}</small></div></div>
      <span class="rel ${q.top?"top":""}">${tr(q.rel)}</span>
      <p class="qpull">${tr(aud.pulls?.[q.id] || q.pull)}</p>
      <blockquote class="qbody">${tr(q.body)}</blockquote>
      <figcaption class="qfoot"><span>${tr(q.d)}</span><button type="button" class="more" aria-expanded="false">${ru()?"Читать полностью":"Read in full"}</button></figcaption>
    </figure>`).join("");
  $("#refs").innerHTML = REFS.map(r=>`<span>${r.n} <small>· ${tr(r.r)}</small></span>`).join("");
  $("#uf-vs").innerHTML = UF_CHANNELS[L].map(c=>`<span>${c}</span>`).join("");
  $("#uf-line").innerHTML = UF_LINE.map(r=>`<span class="y num">${r.y}</span><span class="t">${tr(r.t)}</span>`).join("");
  $("#uf-reels").innerHTML = UF_CLIPS.map(p=>`<button type="button" class="zoom" ${zoomData(p)}>${tileMedia(p, tr(p.c))}<span class="cap">${tr(p.c)}</span></button>`).join("");
  $("#uf-videos").innerHTML = UF_VIDEOS.map(v=>`<a class="video-card" href="${v.href}" target="_blank" rel="noopener"><span class="poster ${v.web?"web":""}"></span><span style="min-width:0"><span class="vt">${tr(v.t)}</span><span class="vs2">${tr(v.s)}</span></span></a>`).join("");
  $("#yt-stats").innerHTML = YT_STATS.map(s=>`<div><b class="num">${tr(s.b)}</b><span>${tr(s.k)}</span></div>`).join("");
  $("#yt-cards").innerHTML = YT_PEOPLE.map(p=>`<article class="pcard">
      ${p.img?`<div class="art"><img src="${p.img}" alt="${tr(p.n)}, METRO Young Talents" loading="lazy"></div>`:`<div class="art ph" aria-hidden="true"><span>${tr(p.ini)}</span></div>`}
      <div class="meta"><p class="ven">${p.v}</p><h4>${tr(p.n)}</h4><p>${tr(p.a)}</p><p>${tr(p.b)}</p><span class="cu">${tr(p.c)}</span></div>
    </article>`).join("");
  $("#yt-photos").innerHTML = YT_PHOTOS.map(p=>`<button type="button" class="zoom" ${zoomData(p)}>${tileMedia(p, tr(p.c))}<span class="cap">${tr(p.c)}</span></button>`).join("");
  $("#yt-give").innerHTML = YT_GIVE[L].map(g=>`<li>${g}</li>`).join("");
  $("#yt-got").innerHTML = YT_GOT.map(g=>`<li>${tr(g)}</li>`).join("");
  $("#pod-chaps").innerHTML = CHAPTERS.map(c=>`<button type="button" data-t="${c.t}"><b class="num">${fmtTime(c.t)}</b>${tr(c.l)}</button>`).join("");
  $("#cta-mail").href = `mailto:beibyt1996@gmail.com?subject=${encodeURIComponent(tr(MAIL))}`;
  $("#cta-wa").href = `https://wa.me/77757435931?text=${encodeURIComponent(tr(WA))}`;
  $("#contacts").innerHTML = CONTACTS.map((c,i)=>`<div class="crow"><span class="l">${tr(c.l)}</span>${c.href?`<a class="v" href="${c.href}" ${c.href.startsWith("http")?'target="_blank" rel="noopener"':""}>${c.v}</a>`:`<span class="v">${c.v}</span>`}<button type="button" class="copy" id="copy-${i}" data-copy="${c.copy}">${ru()?"Копировать":"Copy"}</button></div>`).join("");
  watchVideos(); setupReveal(); carUpdate(); navUpdate();
}

/* ===== language sheet ===== */
function setLang(l){ L=l; try{localStorage.setItem("ba-lang",L)}catch(e){} render(); }
function closeSheet(){ $("#sheet").hidden = true; document.body.style.overflow=""; menuTip(); }
function openSheet(){ const s=$("#sheet"); s.hidden=false; document.body.style.overflow="hidden"; $('#aud-opts [aria-pressed="true"]').focus({preventScroll:true}); }
function setView(m){ if(m!=="short" && m!=="full") return; M=m; try{localStorage.setItem("ba-view",M)}catch(e){} document.documentElement.dataset.view=M; render(); }
function setAud(a){ if(!AUD_IDS.includes(a)) return; A=a; try{localStorage.setItem("ba-aud",A)}catch(e){} render(); }
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ if(!$("#sheet").hidden) closeSheet(); toggleMenu(false); } });

/* ===== mobile menu ===== */
function toggleMenu(open){
  const b=$("#menu-btn"), m=$("#mnav");
  const next = open ?? b.getAttribute("aria-expanded")!=="true";
  b.setAttribute("aria-expanded", String(next)); m.hidden = !next;
  if(next) placeMenu();
  hideTip();
}
/* mobile only: point at the burger once per session, after the language is chosen */
function menuTip(){
  if(getComputedStyle($("#menu-btn")).display==="none") return;
  try{ if(sessionStorage.getItem("ba-tip")) return; sessionStorage.setItem("ba-tip","1"); }catch(e){}
  menuTip.t = setTimeout(()=>{
    if($("#menu-btn").getAttribute("aria-expanded")==="true") return;
    $("#menu-tip").hidden = false; $("#menu-btn").classList.add("hint");
    menuTip.t = setTimeout(hideTip, 6000);
  }, 700);
}
function hideTip(){
  const tip=$("#menu-tip"); clearTimeout(menuTip.t); $("#menu-btn").classList.remove("hint");
  if(tip.hidden) return;
  tip.classList.add("out"); setTimeout(()=>{ tip.hidden=true; tip.classList.remove("out"); }, 250);
}
/* the top banner scrolls away, so the dropdown follows the nav's real bottom edge */
function placeMenu(){ $("#mnav").style.top = Math.max(0, $(".nav").getBoundingClientRect().bottom) + "px"; }
addEventListener("scroll", ()=>{ if(!$("#mnav").hidden) placeMenu(); }, {passive:true});

/* ===== download ===== */
let dlApi = null;
(async()=>{ try{ dlApi = window.claude?.use ? await window.claude.use("downloads") : null; }catch(e){ dlApi=null; } })();
async function downloadCV(){
  const cv = cvFile();
  try{
    if(!dlApi) throw {code:"unavailable"};
    const res = await fetch(cv.file); if(!res.ok) throw {code:"unavailable"};
    await dlApi.save({filename:cv.name, data:await res.blob()});
    toast(ru()?"Резюме сохранено":"CV saved");
  }catch(err){
    if(err && err.code==="declined") return;
    if(err && err.code==="rate_limited"){ toast(ru()?"Подождите секунду и повторите":"Wait a moment and try again"); return; }
    const a=document.createElement("a"); a.href=cv.file; a.download=cv.name; a.target="_blank"; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
  }
}

/* ===== interactions ===== */
document.addEventListener("click", e=>{
  const pick = e.target.closest("#sheet [data-lang]");
  if(pick){ setLang(pick.dataset.lang); return; }
  const vb = e.target.closest("button[data-mode]");
  if(vb){
    /* render() rebuilds the menu and hero buttons, so read where the click came from first */
    const was = M, inSheet = !!vb.closest("#sheet"), inMenu = !!vb.closest("#mnav"), go = vb.dataset.go;
    setView(vb.dataset.mode);
    if(inSheet){ $(`#sheet [data-mode="${M}"]`).focus(); return; }  /* the sheet stays open: the role choice below it is the last step */
    toggleMenu(false);
    if(go){ const t=$(go); t && t.scrollIntoView({behavior:"instant"}); }  /* the page just changed under the reader, so jump instead of gliding past it */
    else if(inMenu) scrollTo({top:0, behavior:reduce?"auto":"smooth"});
    if(was!==M) toast(tr(M==="short" ? T.toast_short : T.toast_full));
    return;
  }
  const ab = e.target.closest("button[data-aud]");
  if(ab){
    const was = A, inSheet = !!ab.closest("#sheet"), inMenu = !!ab.closest("#mnav");
    setAud(ab.dataset.aud);
    if(inSheet){ closeSheet(); return; }
    if(inMenu){ toggleMenu(false); scrollTo({top:0, behavior:reduce?"auto":"smooth"}); }
    else { const f=$(`#aud-hero [data-aud="${A}"]`); f && f.focus({preventScroll:true}); }
    if(was!==A) toast(tr(T.toast_aud) + tr(AUD[A].name));
    return;
  }
  if(e.target.closest("#lang-sw")){ setLang(ru()?"en":"ru"); return; }
  if(e.target.closest("#menu-btn")){ toggleMenu(); return; }
  if(e.target.closest("#menu-tip")){ toggleMenu(true); return; }
  if(e.target.closest("#mnav a")){ toggleMenu(false); return; }
  if(e.target.closest(".dl")){ downloadCV(); return; }
  const more = e.target.closest(".qcard .more");
  if(more){ const c=more.closest(".qcard"); const open=c.classList.toggle("open"); more.setAttribute("aria-expanded",String(open)); more.textContent = open ? (ru()?"Свернуть":"Show less") : (ru()?"Читать полностью":"Read in full"); return; }
  const cp = e.target.closest(".copy");
  if(cp){
    const fallback=()=>{ const v=cp.previousElementSibling; const r=document.createRange(); r.selectNodeContents(v); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast(ru()?"Выделено, нажмите ⌘C":"Selected, press ⌘C"); };
    try{ navigator.clipboard.writeText(cp.dataset.copy).then(()=>toast(ru()?"Скопировано":"Copied"), fallback); }catch(_){ fallback(); }
    return;
  }
  const z = e.target.closest("[data-zoom]");
  if(z){ lightbox(z.dataset.zoom, z.dataset.cap, z.dataset.video); }
});
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("on"),1800); }
function lightbox(src,cap,video){
  const d=document.createElement("div"); d.className="lightbox"; d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true");
  d.innerHTML=`<button type="button">${ru()?"Закрыть":"Close"}</button><figure>${video ? `<video src="${video}" poster="${src}" controls autoplay playsinline></video>` : `<img src="${src}" alt="">`}<p></p></figure>`;
  d.querySelector("p").textContent = cap || "";
  /* the muted tile pauses while its clip plays here with sound, and resumes on close if still on screen */
  const held = video ? [...document.querySelectorAll("video.inl")].filter(v=>!v.paused) : [];
  held.forEach(v=>v.pause());
  const close=()=>{d.remove(); removeEventListener("keydown",esc);
    held.forEach(v=>{ const r=v.getBoundingClientRect(); if(r.bottom>0 && r.top<innerHeight) v.play().catch(()=>{}); }); };
  const esc=e=>{ if(e.key==="Escape") close(); };
  d.addEventListener("click",e=>{ if(e.target===d||e.target.tagName==="BUTTON") close(); });
  addEventListener("keydown",esc); document.body.appendChild(d); d.querySelector("button").focus();
}

/* ===== carousel ===== */
const track=$("#track"), prevB=$("#car-prev"), nextB=$("#car-next");
function carStep(){ const c=track.querySelector(".slide"); return c ? c.getBoundingClientRect().width + (parseFloat(getComputedStyle(track).columnGap)||16) : 280; }
function carUpdate(){ prevB.disabled = track.scrollLeft <= 2; nextB.disabled = track.scrollLeft + track.clientWidth >= track.scrollWidth - 2; prevB.parentElement.style.visibility = (prevB.disabled && nextB.disabled) ? "hidden" : ""; }
prevB.addEventListener("click",()=>track.scrollBy({left:-carStep(), behavior:reduce?"auto":"smooth"}));
nextB.addEventListener("click",()=>track.scrollBy({left:carStep(), behavior:reduce?"auto":"smooth"}));
track.addEventListener("scroll",carUpdate,{passive:true});
addEventListener("resize",carUpdate);

/* ===== podcast player ===== */
function fmtTime(t){ if(!isFinite(t)) return "–:––"; t=Math.floor(t); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), sec=String(t%60).padStart(2,"0"); return h ? `${h}:${String(m).padStart(2,"0")}:${sec}` : `${m}:${sec}`; }
const au=$("#pod-audio"), podEl=$("#pod"), seekEl=$("#pod-seek"); let seeking=false;
const RATES=[1,1.25,1.5,2];
function podFail(){ podEl.classList.add("noaudio"); podEl.classList.remove("playing"); }
au.addEventListener("error", podFail);
au.addEventListener("loadedmetadata", ()=>{ $("#pod-dur").textContent = fmtTime(au.duration); });
au.addEventListener("timeupdate", ()=>{
  $("#pod-cur").textContent = fmtTime(au.currentTime);
  if(!seeking && au.duration){ const v=au.currentTime/au.duration*1000; seekEl.value=v; seekEl.style.setProperty("--p", v/10+"%"); }
});
au.addEventListener("play", ()=>{ podEl.classList.add("playing"); $("#pod-play").setAttribute("aria-label", ru()?"Пауза":"Pause"); });
["pause","ended"].forEach(ev=>au.addEventListener(ev, ()=>{ podEl.classList.remove("playing"); $("#pod-play").setAttribute("aria-label", ru()?"Слушать":"Play"); }));
$("#pod-play").addEventListener("click", ()=>{ if(au.paused){ au.play().catch(err=>{ if(err && err.name!=="AbortError" && err.name!=="NotAllowedError") podFail(); }); } else au.pause(); });
seekEl.addEventListener("input", ()=>{ seeking=true; seekEl.style.setProperty("--p", seekEl.value/10+"%"); if(au.duration) $("#pod-cur").textContent = fmtTime(seekEl.value/1000*au.duration); });
seekEl.addEventListener("change", ()=>{ if(au.duration) au.currentTime = seekEl.value/1000*au.duration; seeking=false; });
$("#pod-back").addEventListener("click", ()=>{ au.currentTime = Math.max(0, au.currentTime-15); });
$("#pod-fwd").addEventListener("click", ()=>{ au.currentTime = Math.min(au.duration||0, au.currentTime+30); });
$("#pod-rate").addEventListener("click", e=>{ const r=RATES[(RATES.indexOf(au.playbackRate)+1)%RATES.length]; au.playbackRate=r; e.currentTarget.textContent = r+"×"; });
$("#pod-chaps").addEventListener("click", e=>{ const b=e.target.closest("[data-t]"); if(!b) return; au.currentTime=+b.dataset.t; au.play().catch(()=>{}); });
if("mediaSession" in navigator){ au.addEventListener("play", ()=>{ try{ navigator.mediaSession.metadata = new MediaMetadata({title:tr(POD.title), artist:"Beibit Akysh · OYLA OUT", artwork:[{src:new URL("media/podcast.jpg", location.href).href, sizes:"1280x1276", type:"image/jpeg"}]}); }catch(e){} }); }
au.src = POD.src;

/* ===== nav highlight ===== */
function navUpdate(){
  const links=[...document.querySelectorAll("#links a")]; let cur=null;
  links.forEach(a=>{ const s=document.querySelector(a.getAttribute("href")); if(s && s.getBoundingClientRect().top<140) cur=a; });
  links.forEach(a=>a.classList.toggle("on",a===cur));
}
addEventListener("scroll",navUpdate,{passive:true});

/* ===== reveal ===== */
let io;
function setupReveal(){
  if(reduce || !("IntersectionObserver" in window)) return;
  io && io.disconnect();
  io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.remove("pre"); io.unobserve(e.target); } }),{rootMargin:"0px 0px -6% 0px"});
  const vh=innerHeight;
  document.querySelectorAll(".rv").forEach(el=>{ if(el.getBoundingClientRect().top>vh) el.classList.add("pre"); io.observe(el); });
}

render();
requestAnimationFrame(()=>$("#hero-photo").classList.add("in"));
if(!urlLang) openSheet(); else menuTip();
</script>
